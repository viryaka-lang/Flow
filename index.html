<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FlowSync - Multi-Profile Cycle & Period Tracker</title>
  
  <!-- Android PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#FF5E7E">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <!-- Google Fonts & Tailwind CSS CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: 'var(--theme-primary)',
            'primary-hover': 'var(--theme-primary-hover)',
            surface: 'var(--theme-surface)',
            card: 'var(--theme-card)'
          }
        }
      }
    }
  </script>

  <!-- Chart.js CDN for Analytics & BBT graphs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- FlowSync Master Stylesheet -->
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body data-theme="rose">

  <!-- PIN Lock Screen Overlay -->
  <div id="pin-lock-screen" class="hidden"></div>

  <!-- Toast Notification Bar -->
  <div id="toast-container" class="toast-msg"></div>

  <!-- Android PWA Install Prompt Banner -->
  <div id="pwa-install-banner" class="hidden sticky top-0 z-50 bg-gradient-to-r from-rose-600 to-purple-600 text-white px-4 py-2.5 flex items-center justify-between text-xs font-bold shadow-lg">
    <div class="flex items-center gap-2">
      <span class="text-base">📱</span>
      <span>Install FlowSync on Android for instant offline access!</span>
    </div>
    <button onclick="window.app.pwaController.promptInstall()" class="px-3 py-1 bg-white text-rose-600 rounded-full font-extrabold shadow hover:bg-slate-100">
      Install
    </button>
  </div>

  <!-- Main Mobile App Frame -->
  <div id="app-root">

    <!-- Top Navigation App Bar -->
    <header class="top-nav px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <button onclick="window.app.openProfileModal()" class="w-9 h-9 rounded-full bg-white/10 border border-white/10 flex items-center justify-center text-lg hover:bg-white/20 transition-all shadow-inner">
          <span id="header-profile-avatar">🌸</span>
        </button>
        <div>
          <h1 id="header-app-title" class="text-base font-extrabold tracking-tight text-white leading-tight">FlowSync</h1>
          <span class="text-[10px] font-semibold text-primary uppercase tracking-widest">Cycle Monitor</span>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- Disguise Stealth Mode Toggle -->
        <button onclick="window.app.settingsView.toggleStealthMode()" title="Toggle Stealth Privacy Disguise" class="p-2 rounded-full bg-white/5 border border-white/10 text-slate-300 hover:bg-white/15 transition-all">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>

        <!-- Quick Settings -->
        <button onclick="window.app.navigate('settings')" class="p-2 rounded-full bg-white/5 border border-white/10 text-slate-300 hover:bg-white/15 transition-all">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <!-- Main View Content Area -->
    <main id="view-container" class="flex-1 overflow-x-hidden"></main>

    <!-- Android Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <div class="flex items-center justify-around px-2 py-1.5">
        
        <!-- Tab 1: Dashboard -->
        <button onclick="window.app.navigate('dashboard')" data-tab="dashboard" class="nav-tab-btn flex flex-col items-center justify-center p-2 text-slate-400 hover:text-white">
          <div class="nav-indicator"></div>
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
          <span class="text-[10px] font-bold mt-1">Today</span>
        </button>

        <!-- Tab 2: Calendar -->
        <button onclick="window.app.navigate('calendar')" data-tab="calendar" class="nav-tab-btn flex flex-col items-center justify-center p-2 text-slate-400 hover:text-white">
          <div class="nav-indicator"></div>
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span class="text-[10px] font-bold mt-1">Calendar</span>
        </button>

        <!-- Floating Center Log FAB -->
        <button onclick="window.app.openLogger()" class="w-12 h-12 -mt-5 rounded-full bg-gradient-to-tr from-rose-500 to-pink-500 text-white flex items-center justify-center shadow-lg shadow-rose-500/40 hover:scale-105 active:scale-95 transition-all">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>

        <!-- Tab 3: Analytics -->
        <button onclick="window.app.navigate('analytics')" data-tab="analytics" class="nav-tab-btn flex flex-col items-center justify-center p-2 text-slate-400 hover:text-white">
          <div class="nav-indicator"></div>
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <span class="text-[10px] font-bold mt-1">Analytics</span>
        </button>

        <!-- Tab 4: Profiles -->
        <button onclick="window.app.navigate('profiles')" data-tab="profiles" class="nav-tab-btn flex flex-col items-center justify-center p-2 text-slate-400 hover:text-white">
          <div class="nav-indicator"></div>
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span class="text-[10px] font-bold mt-1">Profiles</span>
        </button>

      </div>
    </nav>

  </div>

  <!-- Bottom Sheet: Daily Logger Modal -->
  <div id="logger-sheet" class="bottom-sheet-backdrop">
    <div class="bottom-sheet-content">
      <div class="sheet-handle"></div>
      <div id="logger-sheet-body" class="max-h-[85vh] overflow-y-auto"></div>
    </div>
  </div>

  <!-- Bottom Sheet: Profile Editor Modal -->
  <div id="profile-editor-modal" class="bottom-sheet-backdrop"></div>

  <!-- Modal: Doctor / Gynecologist Clinical Report -->
  <div id="doctor-report-modal" class="bottom-sheet-backdrop"></div>

  <!-- ES Module entry -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
